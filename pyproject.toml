[project]
name = "telegram-video-downloader"
version = "0.1.0"
description = "A Telegram bot to download videos from various sources."
authors = [
    { name = "Jules", email = "agent@example.com" }
]
readme = "README.md"
requires-python = "==3.10"
dependencies = [
    "aiogram==3.5.0",
    "yt-dlp==2025.08.11",
    "pytube==15.0.0",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "youtube-search-python==1.6.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.4",
    "black==24.4.2",
    "mypy==1.10.0",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[dependency-groups]
dev = [
    "secretstorage>=3.3.3",
]
